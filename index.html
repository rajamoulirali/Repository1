<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Ticket Booking Portal</title>
  <!-- Basic styling to make it look like a portal -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #0b0f1a;
      color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .portal {
      max-width: 1100px;
      width: 100%;
      background: #131a2c;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 2rem 2rem 2.5rem;
      transition: all 0.2s;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
      color: #ffffff;
    }

    h1 span {
      background: #e11d48;
      font-size: 1.2rem;
      padding: 0.2rem 0.8rem;
      border-radius: 100px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: white;
    }

    .subhead {
      color: #9aa4bf;
      margin-bottom: 2rem;
      font-size: 1rem;
      border-left: 3px solid #e11d48;
      padding-left: 1rem;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .movie-card {
      background: #1e263b;
      border-radius: 1.5rem;
      padding: 1.5rem 1rem 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
      border: 1px solid #2e3a52;
      box-shadow: 0 6px 0 #0a0e16;
    }

    .movie-card:hover {
      background: #252f4a;
      transform: translateY(-3px);
      box-shadow: 0 10px 0 #0a0e16;
    }

    .movie-card.selected {
      background: #2d1f2c;
      border: 1px solid #e11d48;
      box-shadow: 0 0 0 2px #e11d48, 0 10px 0 #0a0e16;
    }

    .movie-poster {
      font-size: 2.8rem;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 6px 6px rgba(0,0,0,0.5));
    }

    .movie-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 0.35rem;
      color: white;
    }

    .movie-meta {
      font-size: 0.8rem;
      color: #9aa4bf;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
    }

    .showtime-section {
      background: #0f1626;
      border-radius: 2rem;
      padding: 1.8rem 1.8rem 2rem;
      border: 1px solid #26304a;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 1.2rem;
      color: #cdd9f4;
      letter-spacing: 0.2px;
    }

    .section-title i {
      font-style: normal;
      font-size: 1.5rem;
    }

    .showtime-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-bottom: 2rem;
    }

    .showtime-btn {
      background: #1b2338;
      border: 1px solid #2f3b58;
      color: #eef2f5;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
      line-height: 1.3;
    }

    .showtime-btn small {
      font-size: 0.7rem;
      color: #8d9ac0;
      font-weight: 400;
    }

    .showtime-btn:hover {
      background: #29334e;
      border-color: #4e5d82;
    }

    .showtime-btn.selected {
      background: #e11d48;
      border-color: #e11d48;
      color: white;
    }

    .showtime-btn.selected small {
      color: #ffd9e0;
    }

    .booking-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .ticket-summary {
      background: #0a0f1a;
      padding: 0.9rem 1.8rem;
      border-radius: 3rem;
      border: 1px solid #2b3651;
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      flex: 1;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
    }

    .summary-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #7d8bb0;
    }

    .summary-value {
      font-size: 1.3rem;
      font-weight: 600;
      color: white;
    }

    .summary-value.highlight {
      color: #facc15;
    }

    .book-btn {
      background: #e11d48;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 1rem 2.8rem;
      border-radius: 3rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 8px 0 #8b0f2f;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .book-btn:hover {
      background: #be123c;
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #8b0f2f;
    }

    .book-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #8b0f2f;
    }

    .book-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #8b0f2f;
      pointer-events: none;
      background: #6b2d3e;
    }

    .message-bar {
      margin-top: 1.5rem;
      padding: 0.9rem 1.5rem;
      border-radius: 3rem;
      background: #0d1422;
      color: #b9c3de;
      font-size: 0.95rem;
      border-left: 4px solid #2e3b5a;
      transition: all 0.2s;
    }

    .message-bar.success {
      border-left-color: #22c55e;
      background: #0f1d1a;
      color: #bcf0cf;
    }

    footer {
      margin-top: 1.8rem;
      font-size: 0.75rem;
      text-align: center;
      color: #4f5b79;
      border-top: 1px solid #1e263b;
      padding-top: 1.5rem;
      letter-spacing: 0.4px;
    }

    .badge-nginx {
      background: #00963920;
      color: #6abf8b;
      padding: 0.2rem 0.8rem;
      border-radius: 100px;
      font-size: 0.7rem;
      border: 1px solid #2e6b47;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .portal { padding: 1.5rem; }
      h1 { font-size: 1.7rem; }
      .booking-actions { flex-direction: column; align-items: stretch; }
      .book-btn { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="portal">
    <h1>
      🎬 CineBook
      <span>portal</span>
    </h1>
    <div class="subhead">
      Served via nginx · select a movie, showtime & book instantly
    </div>

    <!-- Movie selection grid -->
    <div class="movie-grid" id="movieGrid">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Showtime + booking section -->
    <div class="showtime-section">
      <div class="section-title">
        <i>🕒</i> Available showtimes
        <span style="margin-left: auto; font-size: 0.8rem; font-weight: 400; color: #7d8bb0;" id="selectedMovieLabel">Interstellar</span>
      </div>

      <div class="showtime-grid" id="showtimeGrid">
        <!-- Injected via JavaScript -->
      </div>

      <div class="booking-actions">
        <div class="ticket-summary">
          <div class="summary-item">
            <span class="summary-label">Movie</span>
            <span class="summary-value" id="summaryMovie">Interstellar</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Showtime</span>
            <span class="summary-value" id="summaryTime">7:00 PM</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Tickets</span>
            <span class="summary-value highlight" id="summaryPrice">$12.50</span>
          </div>
        </div>

        <button class="book-btn" id="bookBtn">
          🎟️ Book now
        </button>
      </div>

      <!-- feedback message -->
      <div class="message-bar" id="messageBar">
        ⚡ Nginx is serving this static portal — pick a movie & showtime.
      </div>
    </div>

    <footer>
      <span class="badge-nginx">⚙️ nginx / static</span>
      &nbsp;— demo booking interface. No real transactions.
    </footer>
  </div>

  <script>
    (function() {
      // ---------- MOVIE DATA ----------
      const movies = [
        { id: 'interstellar', title: 'Interstellar', emoji: '🌌', duration: '169 min', rating: 'PG-13' },
        { id: 'inception', title: 'Inception', emoji: '🌀', duration: '148 min', rating: 'PG-13' },
        { id: 'dark_knight', title: 'The Dark Knight', emoji: '🦇', duration: '152 min', rating: 'PG-13' },
        { id: 'dune2', title: 'Dune: Part Two', emoji: '🏜️', duration: '166 min', rating: 'PG-13' },
        { id: 'oppenheimer', title: 'Oppenheimer', emoji: '⚛️', duration: '180 min', rating: 'R' }
      ];

      // ---------- SHOWTIMES (per movie, simple demo) ----------
      const showtimesByMovie = {
        interstellar: ['12:30 PM', '3:45 PM', '7:00 PM', '10:15 PM'],
        inception: ['11:00 AM', '2:15 PM', '6:30 PM', '9:45 PM'],
        dark_knight: ['1:00 PM', '4:20 PM', '8:00 PM', '11:10 PM'],
        dune2: ['10:45 AM', '2:00 PM', '6:15 PM', '9:30 PM'],
        oppenheimer: ['12:00 PM', '3:30 PM', '7:45 PM', '10:50 PM']
      };

      // ---------- STATE ----------
      let selectedMovieId = 'interstellar';   // default
      let selectedShowtime = '7:00 PM';       // default for interstellar (will be set after render)
      let ticketPrice = 12.50;                // base price per ticket

      // DOM elements
      const movieGrid = document.getElementById('movieGrid');
      const showtimeGrid = document.getElementById('showtimeGrid');
      const summaryMovie = document.getElementById('summaryMovie');
      const summaryTime = document.getElementById('summaryTime');
      const summaryPrice = document.getElementById('summaryPrice');
      const bookBtn = document.getElementById('bookBtn');
      const messageBar = document.getElementById('messageBar');
      const selectedMovieLabel = document.getElementById('selectedMovieLabel');

      // ---------- RENDER MOVIES ----------
      function renderMovies() {
        movieGrid.innerHTML = movies.map(movie => {
          const isSelected = movie.id === selectedMovieId;
          return `
            <div class="movie-card ${isSelected ? 'selected' : ''}" data-movie-id="${movie.id}">
              <div class="movie-poster">${movie.emoji}</div>
              <div class="movie-title">${movie.title}</div>
              <div class="movie-meta">
                <span>${movie.duration}</span>
                <span>•</span>
                <span>${movie.rating}</span>
              </div>
            </div>
          `;
        }).join('');

        // add click listeners
        document.querySelectorAll('.movie-card').forEach(card => {
          card.addEventListener('click', () => {
            const movieId = card.dataset.movieId;
            if (movieId === selectedMovieId) return; // no change

            // update selected movie
            selectedMovieId = movieId;

            // set default showtime for this movie (first one)
            const defaultShowtimes = showtimesByMovie[selectedMovieId];
            if (defaultShowtimes && defaultShowtimes.length > 0) {
              selectedShowtime = defaultShowtimes[0];
            } else {
              selectedShowtime = '12:00 PM'; // fallback
            }

            // re-render everything
            renderMovies();
            renderShowtimes();
            updateSummaryAndMessage();
            clearMessageStyle();
          });
        });
      }

      // ---------- RENDER SHOWTIMES ----------
      function renderShowtimes() {
        const showtimes = showtimesByMovie[selectedMovieId] || [];
        if (showtimes.length === 0) {
          showtimeGrid.innerHTML = `<div style="color:#9aa4bf; padding:0.5rem;">No showtimes available</div>`;
          return;
        }

        // if selectedShowtime is not in this list, set to first
        if (!showtimes.includes(selectedShowtime)) {
          selectedShowtime = showtimes[0];
        }

        showtimeGrid.innerHTML = showtimes.map(time => {
          const isSelected = time === selectedShowtime;
          // simple price variation (matinee before 5pm cheaper)
          const hour = parseInt(time.split(':')[0], 10);
          const isMatinee = time.includes('AM') || (hour < 5 && time.includes('PM'));
          const price = isMatinee ? 9.50 : 12.50;

          return `
            <button class="showtime-btn ${isSelected ? 'selected' : ''}" data-time="${time}" data-price="${price}">
              ${time}
              <small>$${price.toFixed(2)}</small>
            </button>
          `;
        }).join('');

        // attach listeners
        document.querySelectorAll('.showtime-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const newTime = btn.dataset.time;
            const price = parseFloat(btn.dataset.price);
            if (newTime === selectedShowtime) return;

            selectedShowtime = newTime;
            ticketPrice = price;

            // update selected class (re-render is simpler)
            renderShowtimes(); // re-render to update selection
            updateSummaryAndMessage();
            clearMessageStyle();
          });
        });

        // update price based on selected showtime (after render)
        const currentShowtimeBtn = Array.from(document.querySelectorAll('.showtime-btn'))
          .find(btn => btn.dataset.time === selectedShowtime);
        if (currentShowtimeBtn) {
          ticketPrice = parseFloat(currentShowtimeBtn.dataset.price) || 12.50;
        } else {
          ticketPrice = 12.50;
        }
      }

      // ---------- UPDATE SUMMARY & MESSAGE ----------
      function updateSummaryAndMessage() {
        const movie = movies.find(m => m.id === selectedMovieId);
        summaryMovie.textContent = movie ? movie.title : '—';
        summaryTime.textContent = selectedShowtime;
        summaryPrice.textContent = `$${ticketPrice.toFixed(2)}`;
        selectedMovieLabel.textContent = movie ? movie.title : '—';

        // message with nginx hint + current selection
        messageBar.textContent = `⚡ nginx · selected: ${movie ? movie.title : '?'} @ ${selectedShowtime} · ticket $${ticketPrice.toFixed(2)}`;
        // remove success class if any
        messageBar.classList.remove('success');
      }

      function clearMessageStyle() {
        messageBar.classList.remove('success');
      }

      // ---------- BOOK BUTTON ----------
      bookBtn.addEventListener('click', () => {
        const movie = movies.find(m => m.id === selectedMovieId);
        if (!movie) return;

        // simple validation (always passes here)
        const confirmationMessage = `✅ Booking confirmed: ${movie.title} at ${selectedShowtime} — $${ticketPrice.toFixed(2)} per ticket. (demo via nginx)`;
        messageBar.textContent = confirmationMessage;
        messageBar.classList.add('success');

        // tiny visual feedback
        bookBtn.style.transform = 'scale(0.98)';
        setTimeout(() => { bookBtn.style.transform = ''; }, 100);
      });

      // ---------- INITIAL SETUP ----------
      function init() {
        // ensure selectedShowtime valid for default movie
        const defaultShowtimes = showtimesByMovie[selectedMovieId];
        if (defaultShowtimes && defaultShowtimes.includes('7:00 PM')) {
          selectedShowtime = '7:00 PM';
          // set price accordingly
          const hour = 7;
          ticketPrice = (hour < 5) ? 9.50 : 12.50;
        } else if (defaultShowtimes && defaultShowtimes.length) {
          selectedShowtime = defaultShowtimes[0];
          const timeStr = defaultShowtimes[0];
          const hour = parseInt(timeStr.split(':')[0], 10);
          ticketPrice = (timeStr.includes('AM') || (hour < 5 && timeStr.includes('PM'))) ? 9.50 : 12.50;
        } else {
          selectedShowtime = '7:00 PM';
          ticketPrice = 12.50;
        }

        // Render everything
        renderMovies();
        renderShowtimes();
        updateSummaryAndMessage();
        messageBar.classList.remove('success');
      }

      init();
    })();
  </script>
</body>
</html>
